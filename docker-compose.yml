services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app/src
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demand_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d demand_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
